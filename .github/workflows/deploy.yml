name: AWS OIDC Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-demo:
    name: Verify AWS access via OIDC
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::393036065076:role/S3-ROLE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Print OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
           "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
            | base64 -d 2>/dev/null | jq '{sub, aud, iss}'      

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
            | base64 -d 2>/dev/null | jq '{sub, aud, iss}'    

      - name: Check AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      - name: List S3 buckets
        run: |
          echo "Listing S3 buckets..."
          aws s3 ls
          echo "Done."
